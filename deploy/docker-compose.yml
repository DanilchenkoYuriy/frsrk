# Сайт ФРСРК на сервере FirstVDS.
# Caddy (посетители, HTTPS) и PostgreSQL общие для всех проектов сервера:
# они в отдельном проекте server-firstvds, на сервере /opt/server.
# Запуск на сервере: cd /opt/sites/frsrk/deploy && docker compose up -d --build

services:
  frsrk:
    build: ..
    restart: unless-stopped
    env_file: frsrk.env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

# Общая сеть сервера: через неё сайт видит базу postgres, а Caddy видит сайт.
networks:
  default:
    name: web
    external: true
